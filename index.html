<!DOCTYPE html>
<html lang="fr-FR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <link rel="stylesheet" href="./css/style.css">
    <title>Fortune Avenue</title>
</head>

<body>
    <div class="game-grid">
        <h1>Fortune Avenue</h1>
        <!-- game board (left) -->
        <div class="board-container">
            <img src="./images/gameboard_v2.svg" class="board-image" />
            <canvas id="board-canvas" class="board-canvas"></canvas>
        </div>

        <!-- Sidebar (right) -->
        <div class="sidebar">
            <h2>Joueur 1 - 1500 M</h2>
            <h3 id="cards-player1">Cartes</h3>
            <div id="houses-player1">Maisons: </div>
            <div id="hostels-player1">Hôtels: </div>

            <h2>Joueur 2 - 1500 M</h2>
            <h3 id="cards-player2">Cartes</h3>
            <div id="houses-player2">Maisons: </div>
            <div id="hostels-player2">Hôtels: </div>
        </div>

        <!-- Footer: buttons -->
        <div class="footer">
            <button>Menu</button>
            <button>Construire</button>
            <button>Vendre</button>
            <button>Hypothéquer</button>
            <button>Lever hypothèque</button>
            <button>Échanger</button>
        </div>
    </div>
</body>
</html>
